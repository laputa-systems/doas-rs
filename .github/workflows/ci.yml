name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dev image
        run: docker build -t doas-dev .
      - name: Clippy and tests in Alpine edge
        run: docker run --rm doas-dev sh -lc 'cargo clippy --all-targets -- -D warnings && cargo test'
