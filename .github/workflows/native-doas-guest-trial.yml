name: Native Doas privilege trial

on: pull_request

permissions:
  contents: read

jobs:
  qemu:
    name: Installed Doas behavior in KVM
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: laputa-systems/mdevd-rs
          ref: 0405d2df21b646d787ba6846753e980d2d5312b7
          path: .work/tmp/mdevd-source
          persist-credentials: false
      - name: Build the Doas candidate for native x86-64
        run: |
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          docker build --platform linux/amd64 -t doas-priv-trial .
          docker run --rm --platform linux/amd64 --network none \
            --volume "$PWD/.work/tmp:/proof" \
            --env CARGO_BUILD_JOBS=2 \
            doas-priv-trial sh -ec '
              export TMPDIR=/proof
              cargo build --locked --offline --release --target x86_64-unknown-linux-musl
              cp target/x86_64-unknown-linux-musl/release/doas /proof/doas
            '
          file .work/tmp/doas
          sha256sum .work/tmp/doas
      - name: Run the existing Doas guest harness
        run: |
          docker run --rm --platform linux/amd64 --device /dev/kvm \
            --volume "$PWD:/work" --workdir /work \
            --env CARGO_BUILD_JOBS=2 \
            --entrypoint /bin/sh \
            ghcr.io/joshuarli/musl-toolchain@sha256:80f0ffb39c786eb6242b7b0345ddce3c6106c687c401d1fc0ea2ca69cf61c314 -ec '
              git config --global --add safe.directory /work
              apk add --no-cache e2fsprogs=1.47.4-r0 qemu-system-x86_64=11.0.3-r0
              qemu-system-x86_64 --version
              guest=/work/.work/tmp/mdevd-source
              env "RUSTFLAGS=-Clinker=mold -Clinker-flavor=ld" sh "$guest/tools/build-qemu-guest.sh"
              bash harness/vm-priv.sh "$guest/.work/guest-root" "$guest/.work/vmlinuz-virt" "$guest/.work/initramfs-virt" .work/tmp/doas
              grep -E "^DOAS_PRIV_.*_OK|^VM_EXIT=" .work/vm-priv/console.log
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: doas-native-guest-console
          path: .work/vm-priv/*.log
          include-hidden-files: true
